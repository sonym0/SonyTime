name: Build Esraa APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Apply Esraa branding (icon + splash)
        run: |
          cp -r branding/android-res/* android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp branding/splash.png {} \;

      - name: Remove unused INTERNET permission
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('    <uses-permission android:name="android.permission.INTERNET" />\n', '')
          text = text.replace('<uses-permission android:name="android.permission.INTERNET" />', '')
          manifest.write_text(text)
          PY2
          if grep -R 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then exit 1; fi

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify merged manifest has no INTERNET permission
        run: |
          if grep -R 'android.permission.INTERNET' android/app/build/intermediates/merged_manifest/debug/processDebugManifest/AndroidManifest.xml; then
            echo 'INTERNET permission is still present in merged manifest'
            exit 1
          fi
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: esraa-v3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
