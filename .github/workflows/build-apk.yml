name: Build Sony time APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SONYTIME_TEST_BUILD: '1'
      VITE_SONYTIME_TEST_BUILD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npm install --no-save typescript && npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Verify generated test application ID
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          gradle = Path('android/app/build.gradle').read_text()
          if not re.search(r'applicationId\s+["\']com\.sonytime\.app\.test["\']', gradle):
              raise SystemExit('Generated Android project does not use com.sonytime.app.test')
          PY

      - name: Remove unused INTERNET permission and restrict file sharing
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('    <uses-permission android:name="android.permission.INTERNET" />\n', '')
          text = text.replace('<uses-permission android:name="android.permission.INTERNET" />', '')
          manifest.write_text(text)
          fp = Path('android/app/src/main/res/xml/file_paths.xml')
          fp.parent.mkdir(parents=True, exist_ok=True)
          fp.write_text('''<paths xmlns:android="http://schemas.android.com/apk/res/android">\n    <external-path name="sonytime_test_exports" path="Documents/SonyTimeTest/exports/" />\n    <cache-path name="sonytime_test_share_cache" path="SonyTimeTest/exports/" />\n</paths>\n''')
          PY2
          if grep -R 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then exit 1; fi

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity and debug signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          test "$("$APKANALYZER" manifest application-id "$APK")" = 'com.sonytime.app.test'
          "$APKANALYZER" manifest version-name "$APK"
          "$APKANALYZER" manifest version-code "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sony-time-test-v1.1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
