.app{max-width:520px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:800;font-size:22px;letter-spacing:.5px;direction:ltr}
.brand i{color:var(--b);font-style:normal}
.date{color:var(--mu);font-size:14px}
.clock{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 16px;text-align:center}
.time{font-size:54px;font-weight:800;direction:ltr;line-height:1.1;font-variant-numeric:tabular-nums}
.state{margin-top:8px;font-size:15px;color:var(--mu)}
.state b{color:var(--g)}
.state.off b{color:var(--r)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.btn{border:2px solid;border-radius:24px;height:132px;font:800 22px Cairo,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#fff;transition:transform .12s,opacity .2s}
.btn svg{width:34px;height:34px}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.25;cursor:not-allowed;box-shadow:none!important}
.in{border-color:var(--g);color:var(--g);background:radial-gradient(circle at 50% 0,rgba(57,255,136,.22),rgba(57,255,136,.04));box-shadow:0 0 22px rgba(57,255,136,.45),inset 0 0 18px rgba(57,255,136,.15);text-shadow:0 0 12px var(--g)}
.out{border-color:var(--r);color:var(--r);background:radial-gradient(circle at 50% 0,rgba(255,45,85,.22),rgba(255,45,85,.04));box-shadow:0 0 22px rgba(255,45,85,.45),inset 0 0 18px rgba(255,45,85,.15);text-shadow:0 0 12px var(--r)}
.month{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.month h2{margin:0;font-size:18px}
.nav{background:var(--panel);border:1px solid var(--line);color:var(--tx);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.st.big{grid-column:1/-1;border-color:var(--b);background:linear-gradient(135deg,rgba(91,140,255,.16),var(--panel))}
.st span{display:block;color:var(--mu);font-size:13px}
.st b{display:block;font-size:24px;margin-top:2px}
.st.big b{font-size:34px}
.row2{display:flex;gap:10px;margin:14px 0}
.act{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:12px;font:600 15px Cairo,sans-serif;cursor:pointer}
.act.x{border-color:var(--b);color:var(--b)}
.day{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.dh{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(91,140,255,.08);font-weight:600;font-size:14px}
.dh em{font-style:normal;color:var(--b)}
.se{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.se .t{direction:ltr;color:var(--mu)}
.se .t u{text-decoration:none;color:var(--g)}
.se .t s{text-decoration:none;color:var(--r)}
.se .d{font-weight:600}
.del{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:0 4px}
.empty{text-align:center;color:var(--mu);padding:30px 10px;border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.clock,.st,.day,.nav,.act,.toast{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.clock{border-color:rgba(80,220,255,.35);box-shadow:0 0 30px rgba(40,190,255,.18)}
.time{text-shadow:0 0 18px rgba(80,220,255,.7)}
.brand{text-shadow:0 0 14px rgba(80,220,255,.6)}
button:focus-visible{outline:2px solid var(--b);outline-offset:2px}


/* V1.1 local/offline controls */
@font-face{font-family:CairoLocal;src:url('../public/assets/fonts/cairo-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:CairoLocal;src:url('../public/assets/fonts/cairo-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:CairoLocal;src:url('../public/assets/fonts/cairo-800.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
body{font-family:CairoLocal,Cairo,system-ui,sans-serif}
.btn,.act{font-family:CairoLocal,Cairo,system-ui,sans-serif}
.row3{display:flex;gap:10px;margin:10px 0 14px}.row3 .act{min-width:0}
.statusline{font-size:12px;color:var(--mu);text-align:center;margin-top:6px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px}.modal.on{display:flex}.sheet{width:min(520px,100%);background:#0b1324;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.55)}.sheet h3{margin:0 0 8px}.sheet p{color:var(--mu);font-size:13px;line-height:1.7}.sheet .row2{margin-bottom:0}
</style>
</head><body>

<div class="app">
<header><div class="brand">Sony <i>time</i></div><div class="date" id="date"></div></header>

<div class="state" id="state"></div>
</section>

<div class="btns">

<button class="btn out" id="bout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>انصراف</button>
</div>

<button class="nav" id="next" aria-label="الشهر التالي">›</button>

</div>

<div id="log"></div>

</div>
